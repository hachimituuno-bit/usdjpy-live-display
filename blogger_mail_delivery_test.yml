name: NEW Blogger short-mail diagnostic (manual only)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true=preview, false=send ONE short test post'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test short Mail2Blogger message
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
        run: |
          python3 - <<'PY'
          import os, ssl, smtplib
          from datetime import datetime, timedelta, timezone
          from email.message import EmailMessage
          from email.utils import format_datetime, make_msgid

          now = datetime.now(timezone(timedelta(hours=9)))
          subject = 'メール投稿テスト ' + now.strftime('%Y-%m-%d %H:%M')
          body = '短いテストメールです。\n\n#end\n'
          if os.getenv('DRY_RUN', 'true').lower() != 'false':
              print('DRY RUN: 送信しません。', subject, repr(body))
              raise SystemExit(0)

          user = os.environ['SMTP_USERNAME'].strip()
          password = os.environ['SMTP_PASSWORD']
          recipient = os.environ['BLOGGER_POST_EMAIL'].strip()
          if not user or not password or not recipient.lower().endswith('@blogger.com'):
              raise RuntimeError('GitHub Secretsが不足、または宛先が不正です')
          if any(c in user + recipient for c in '\r\n '):
              raise RuntimeError('メールアドレスに空白や改行が含まれています')

          msg = EmailMessage()
          msg['From'], msg['To'], msg['Subject'] = user, recipient, subject
          msg['Date'], msg['Message-ID'] = format_datetime(now), make_msgid()
          msg.set_content(body, charset='utf-8', cte='quoted-printable')
          try:
              with smtplib.SMTP_SSL('smtp.gmail.com', 465, context=ssl.create_default_context(), timeout=30) as smtp:
                  smtp.login(user, password)
                  smtp.send_message(msg)
          except (smtplib.SMTPException, OSError) as exc:
              raise RuntimeError('SMTPエラー: ' + type(exc).__name__) from None
          print('SMTP受付成功。Bloggerの投稿一覧とGmailの不達通知を確認してください。')
          PY
