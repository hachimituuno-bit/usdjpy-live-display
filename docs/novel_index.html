<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>連載小説・作品別の全話目次</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f6fb; color: #183047; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif; line-height: 1.6; }
  main { max-width: 930px; margin: 0 auto; padding: 24px 14px 48px; }
  h1 { margin: 0 0 7px; font-size: clamp(24px, 4.2vw, 32px); line-height: 1.35; }
  .intro { color: #596879; font-size: 14px; margin: 0 0 16px; }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .count { font-size: 15px; font-weight: 700; }
  button { font: inherit; cursor: pointer; background: #1266c9; color: #fff; border: 0; border-radius: 9px; padding: 9px 15px; font-size: 13px; font-weight: 700; }
  button:hover { background: #0757b4; }
  button:disabled { opacity: .65; cursor: wait; }
  #status { color: #536679; font-size: 13px; min-height: 24px; margin-bottom: 12px; }
  #status.error { color: #a63735; }
  .nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 18px; }
  .nav a { text-decoration: none; color: #075cab; font-size: 13px; border: 1px solid #d4e1f2; background: #fff; border-radius: 999px; padding: 7px 12px; }
  .nav a:hover, .nav a:focus { text-decoration: underline; }
  .work { margin: 0 0 24px; overflow: hidden; border-radius: 14px; background: #fff; border: 1px solid #dae3ef; }
  .work-head { background: #e9f0fa; padding: 16px 18px 14px; }
  .work-label { font-size: 12px; color: #53677e; font-weight: 700; margin: 0 0 5px; }
  h2 { font-size: clamp(19px, 3.4vw, 25px); line-height: 1.45; margin: 0; overflow-wrap: anywhere; }
  .work-summary { font-size: 13px; color: #4d6178; margin: 5px 0 0; }
  .items { display: grid; gap: 0; }
  .item { display: flex; gap: 14px; align-items: center; min-height: 57px; padding: 10px 16px; border-top: 1px solid #edf1f6; }
  .num { flex: 0 0 60px; font-size: 13px; font-weight: 700; color: #65778c; }
  .detail { flex: 1; min-width: 0; }
  .episode-link { font-size: 15px; font-weight: 700; color: #075bad; text-decoration: none; overflow-wrap: anywhere; }
  .episode-link:hover, .episode-link:focus { text-decoration: underline; }
  .date { color: #6b7d90; font-size: 12px; margin-top: 1px; }
  .muted { color: #8493a4; font-size: 13px; }
  .warning { color: #93521d; font-size: 12px; margin: 5px 0 0; }
  .empty { background: #fff; padding: 18px; border-radius: 10px; border: 1px solid #dde6f0; color: #56677a; }
  .foot { font-size: 12px; color: #657589; margin: 18px 2px 0; }
  @media(max-width: 490px) { .work-head { padding: 14px 12px; } .item { padding: 9px 10px; gap: 8px; } .num { flex-basis: 50px; font-size: 12px; } .episode-link { font-size: 14px; } }
</style>
</head>
<body>
<main>
  <h1>連載小説・作品別 全話目次</h1>
  <p class="intro">旧方式と新方式の小説をまとめて表示します。作品名ごとに全30話の目次を自動作成。ラベル・Apps Script・OAuthは不要です。</p>
  <div class="controls">
    <span id="count" class="count">公開記事を確認中…</span>
    <button type="button" id="refresh">最新の一覧に更新</button>
  </div>
  <div id="status" role="status" aria-live="polite">Bloggerの公開記事を読み込み中…</div>
  <nav id="works-nav" class="nav" aria-label="作品一覧"></nav>
  <div id="works"></div>
  <p class="foot">Bloggerの公開記事タイトルから「【作品名】第○話」を判定し、公開済みの話へリンクします。次の作品が第1話から投稿されたら、その作品の目次も自動で追加します。記事の投稿後は、ページを開き直すか更新ボタンを押してください。</p>
</main>
<script>
(() => {
  'use strict';
  const BLOG_ORIGIN = 'https://hachinosuke7.blogspot.com';
  const EPISODES_PER_WORK = 30;
  const PAGE_SIZE = 100;
  const MAX_PAGES = 150; // 最多15,000件。上限に達した場合は警告する。
  const countElement = document.getElementById('count');
  const statusElement = document.getElementById('status');
  const worksElement = document.getElementById('works');
  const navElement = document.getElementById('works-nav');
  const refreshButton = document.getElementById('refresh');
  let loading = false;
  let callbackSerial = 0;

  function report(message, isError = false) {
    statusElement.textContent = message;
    statusElement.classList.toggle('error', isError);
  }

  // タイトルの共通形式：【作品名】第1話「副題」
  // 元の「刻限の偽証」と、将来の別作品を同じ規則で検出する。
  function identifyEpisode(originalTitle) {
    const rawTitle = String(originalTitle || '').trim();
    const title = rawTitle.normalize('NFKC');
    const matched = title.match(/^【\s*([^】\n]{2,120}?)\s*】\s*第\s*(\d{1,3})\s*話(?=\s|「|『|\(|\[|$)/u);
    if (!matched) return null;
    const originalMatch = rawTitle.match(/^【\s*([^】\n]{2,120}?)\s*】\s*第\s*[0-9０-９]{1,3}\s*話(?=\s|「|『|\(|\[|$)/u);
    const seriesTitle = (originalMatch?.[1] || matched[1]).trim().replace(/\s+/gu, ' ');
    const seriesKey = matched[1].trim().replace(/\s+/gu, ' ');
    const episodeNumber = Number(matched[2]);
    if (episodeNumber < 1 || episodeNumber > EPISODES_PER_WORK || !seriesTitle) return null;
    const subtitle = (originalMatch ? rawTitle.slice(originalMatch[0].length) : title.slice(matched[0].length)).trim() || '本文を読む';
    return { seriesTitle, seriesKey, episodeNumber, subtitle };
  }

  function safePostUrl(entry) {
    const alternate = (entry.link || []).find(link => link.rel === 'alternate' && link.href);
    if (!alternate) return '';
    try {
      const url = new URL(alternate.href, BLOG_ORIGIN);
      if (url.hostname !== new URL(BLOG_ORIGIN).hostname) return '';
      if (!/^\/\d{4}\/\d{2}\/[^/]+\.html$/u.test(url.pathname)) return '';
      url.protocol = 'https:';
      url.search = '';
      url.hash = '';
      return url.href;
    } catch (_) { return ''; }
  }

  function addEntry(works, entry) {
    const rawTitle = entry?.title?.$t || '';
    const info = identifyEpisode(rawTitle);
    if (!info) return;
    const url = safePostUrl(entry);
    if (!url) return;
    const date = /^\d{4}-\d{2}-\d{2}/u.exec(entry?.published?.$t || '')?.[0] || '';
    const id = info.seriesKey;
    let work = works.get(id);
    if (!work) {
      work = { title: info.seriesTitle, episodes: new Map(), firstDate: '', latestDate: '' };
      works.set(id, work);
    }
    const episodeList = work.episodes.get(info.episodeNumber) || [];
    if (!episodeList.some(post => post.url === url)) {
      episodeList.push({ url, date, subtitle: info.subtitle, rawTitle });
      work.episodes.set(info.episodeNumber, episodeList);
    }
    if (date && (!work.firstDate || date < work.firstDate)) work.firstDate = date;
    if (date && (!work.latestDate || date > work.latestDate)) work.latestDate = date;
  }

  function workList(works) {
    // 作品開始日の古い順。第1作品→第2作品の順番が変わらない。
    return Array.from(works.values()).sort((a, b) =>
      (a.firstDate || '9999').localeCompare(b.firstDate || '9999', 'ja') || a.title.localeCompare(b.title, 'ja')
    );
  }

  function render(works) {
    const ordered = workList(works);
    const episodeCount = ordered.reduce((sum, work) => sum + work.episodes.size, 0);
    countElement.textContent = ordered.length + '作品・公開済み ' + episodeCount + '話';
    navElement.replaceChildren();
    worksElement.replaceChildren();
    if (!ordered.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '作品の公開記事を確認しています。公開フィードが無効な場合は自動取得できません。';
      worksElement.appendChild(empty);
      return;
    }
    const fragment = document.createDocumentFragment();
    ordered.forEach((work, index) => {
      const anchorId = 'work-' + (index + 1);
      const quickLink = document.createElement('a');
      quickLink.href = '#' + anchorId;
      quickLink.textContent = '第' + (index + 1) + '作品：' + work.title;
      navElement.appendChild(quickLink);

      const section = document.createElement('section');
      section.className = 'work';
      section.id = anchorId;
      const header = document.createElement('header');
      header.className = 'work-head';
      const label = document.createElement('p');
      label.className = 'work-label';
      label.textContent = '第' + (index + 1) + '作品';
      const title = document.createElement('h2');
      title.textContent = work.title;
      const summary = document.createElement('p');
      summary.className = 'work-summary';
      summary.textContent = '公開済み ' + work.episodes.size + ' / ' + EPISODES_PER_WORK + ' 話' +
        (work.episodes.size === EPISODES_PER_WORK ? '　・　全30話完結' : '　・　連載中');
      header.append(label, title, summary);
      section.appendChild(header);
      const rows = document.createElement('div');
      rows.className = 'items';
      const maxSeen = Math.max(0, ...work.episodes.keys());
      for (let n = 1; n <= EPISODES_PER_WORK; n++) {
        const row = document.createElement('div');
        row.className = 'item';
        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = '第' + n + '話';
        const detail = document.createElement('div');
        detail.className = 'detail';
        const posts = work.episodes.get(n) || [];
        if (!posts.length) {
          const text = document.createElement('span');
          text.className = 'muted';
          text.textContent = n < maxSeen ? '記事が見つかりません（要確認）' : '未公開';
          detail.appendChild(text);
        } else {
          posts.sort((a, b) => a.date.localeCompare(b.date) || a.url.localeCompare(b.url));
          posts.forEach(post => {
            const link = document.createElement('a');
            link.className = 'episode-link';
            link.href = post.url;
            link.target = '_top';
            link.textContent = post.subtitle;
            detail.appendChild(link);
            if (post.date) {
              const date = document.createElement('div');
              date.className = 'date';
              date.textContent = '公開日 ' + post.date;
              detail.appendChild(date);
            }
          });
          if (posts.length > 1) {
            const warning = document.createElement('div');
            warning.className = 'warning';
            warning.textContent = '同じ話数の公開記事が複数あります。重複投稿を確認してください。';
            detail.appendChild(warning);
          }
        }
        row.append(num, detail);
        rows.appendChild(row);
      }
      section.appendChild(rows);
      fragment.appendChild(section);
    });
    worksElement.appendChild(fragment);
  }

  // 従来の目次と同じBlogger公開フィードのJSONP方式を維持。
  // 他のアカウントやAPIキーは使用しない。
  function getJsonp(start, kind) {
    return new Promise((resolve, reject) => {
      const name = '__works_toc_cb_' + Date.now() + '_' + (++callbackSerial);
      const script = document.createElement('script');
      let done = false;
      let timer;
      function finish(error, data) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        delete window[name];
        script.remove();
        if (error) reject(error); else resolve(data);
      }
      window[name] = data => finish(null, data);
      script.onerror = () => finish(new Error('Bloggerの公開フィードに接続できません'));
      const params = new URLSearchParams({
        alt: 'json-in-script',
        'max-results': String(PAGE_SIZE),
        'start-index': String(start),
        callback: name,
      });
      script.src = BLOG_ORIGIN + '/feeds/posts/' + kind + '?' + params.toString();
      timer = setTimeout(() => finish(new Error('Bloggerの応答がタイムアウトしました')), 12000);
      document.head.appendChild(script);
    });
  }

  async function getFeed(start) {
    try { return await getJsonp(start, 'summary'); }
    catch (e) {
      try { return await getJsonp(start, 'default'); }
      catch (_) { throw e; }
    }
  }

  async function reload() {
    if (loading) return;
    loading = true;
    refreshButton.disabled = true;
    report('Bloggerの公開記事を読み込み中…');
    const works = new Map();
    const seen = new Set();
    let start = 1;
    let complete = false;
    try {
      for (let page = 0; page < MAX_PAGES; page++) {
        const response = await getFeed(start);
        if (!response?.feed) throw new Error('フィード形式を認識できません');
        const entries = response.feed.entry || [];
        if (!Array.isArray(entries)) throw new Error('記事リストを認識できません');
        const total = Number(response.feed['openSearch$totalResults']?.$t || 0);
        let discovered = 0;
        for (const entry of entries) {
          const key = entry?.id?.$t || safePostUrl(entry);
          if (key && seen.has(key)) continue;
          if (key) seen.add(key);
          discovered++;
          addEntry(works, entry);
        }
        render(works);
        if (entries.length === 0 || discovered === 0 || (total > 0 && start + entries.length > total) || (total === 0 && entries.length < PAGE_SIZE)) {
          complete = true;
          break;
        }
        start += entries.length;
        report('公開記事を確認中… ' + works.size + '作品を発見（' + seen.size + '件を確認）');
      }
      if (!works.size) {
        report('小説記事が見つかりません。Bloggerの公開フィードと記事タイトルを確認してください。', true);
      } else if (!complete) {
        report('ブログの記事数が取得上限を超えています。一部の古い作品を表示できない可能性があります。', true);
      } else {
        report('公開記事から作品別の目次を更新しました。');
      }
    } catch (error) {
      render(works);
      report('公開フィードの取得に失敗しました。' + (works.size ? ' 取得済みの作品は表示しています。' : ' Bloggerのフィード設定を確認してください。'), true);
      console.warn('Novel works index:', error);
    } finally {
      loading = false;
      refreshButton.disabled = false;
    }
  }

  refreshButton.addEventListener('click', reload);
  reload();
})();
</script>
</body>
</html>
