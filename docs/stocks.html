<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>日本株・買いスコア上位3銘柄</title><style>body{margin:0;font-family:system-ui,-apple-system,'Yu Gothic',Meiryo,sans-serif;color:#222;background:white;font-size:17px;line-height:1.65}main{padding:8px 14px}h2{font-size:24px;margin:8px 0 4px}h3{font-size:21px;margin:0 0 8px}p{margin:8px 0}small,.muted{color:#666}section{border-top:1px solid #ddd;padding:20px 0}strong.score{font-size:21px}.chart{width:100%;height:auto;display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 14px}.stat{background:#f7f7f7;border-radius:6px;padding:6px 10px}.note{font-size:14px;color:#555}#status{font-size:14px;color:#666}svg text{font-size:11px;fill:#666}svg .line{fill:none;stroke:#2563eb;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}</style></head><body><main><h2>日本株・買いスコア上位3銘柄</h2><p id="status">株式データを読み込み中…</p><div id="result"></div><p class="note">買いスコアはルールに基づく指標評価であり、上昇確率や利益を保証するものではありません。</p></main><script>
(function(){
const base='https://hachimituuno-bit.github.io/usdjpy-live-display/stocks_latest.json';
const status=document.getElementById('status');const result=document.getElementById('result');
const format=n=>Number.isFinite(Number(n))?Number(n).toLocaleString('ja-JP',{maximumFractionDigits:4}):'—';
function el(tag, text, className){const x=document.createElement(tag);if(text!==undefined&&text!==null)x.textContent=String(text);if(className)x.className=className;return x;}
function chart(points){const valid=(Array.isArray(points)?points:[]).filter(p=>Number.isFinite(Number(p.close)));if(valid.length<2)return el('p','チャートデータが不足しています。');let w=640,h=180,pad=24;let vals=valid.map(x=>Number(x.close));let min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;min-=range*.08;max+=range*.08;const coords=valid.map((x,i)=>[pad+i*(w-2*pad)/(valid.length-1),h-pad-(Number(x.close)-min)*(h-2*pad)/(max-min)]);const wrap=document.createElement('div');let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('role','img');svg.setAttribute('aria-label','直近の終値推移チャート');svg.setAttribute('class','chart');let line=document.createElementNS(svg.namespaceURI,'polyline');line.setAttribute('points',coords.map(p=>p.join(',')).join(' '));line.setAttribute('class','line');svg.appendChild(line);wrap.appendChild(svg);let d=el('p',`${valid[0].date||''} 〜 ${valid[valid.length-1].date||''}　安値 ${format(Math.min(...vals))}円／高値 ${format(Math.max(...vals))}円`,'note');wrap.appendChild(d);return wrap;}
async function load(){try{const r=await fetch(base+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const stocks=Array.isArray(data.stocks)?data.stocks:[];if(!stocks.length)throw Error('stocks が空です');result.replaceChildren();status.textContent=`データ生成：${data.generated_at_jst||'不明'} ／ ${data.universe||''}`;stocks.slice(0,3).forEach((s,i)=>{let section=el('section');section.appendChild(el('h3',`${i+1}位：${s.name||s.symbol||'銘柄不明'}（${s.symbol||'—'}）`));section.appendChild(el('p',`買いスコア ${format(s.score_buy)}% ／ 売りスコア ${format(s.score_sell)}%`,'score'));let grid=el('div',null,'grid');[['終値',s.close],['MA5',s.ma5],['MA20',s.ma20],['MACD',s.macd],['シグナル',s.signal],['RSI(14)',s.rsi14]].forEach(([k,v])=>grid.appendChild(el('div',`${k}：${format(v)}${k==='終値'?'円':''}`,'stat')));section.appendChild(grid);section.appendChild(el('p',`基準日：${s.date||'—'}`,'muted'));section.appendChild(chart(s.chart));result.appendChild(section)});const note=el('p',`${data.method||''}　${data.data_source||''}`,'note');result.appendChild(note)}catch(err){status.textContent='株式データを読み込めませんでした：'+err.message;}}
load();setInterval(load,5*60*1000);
})();
</script></body></html>
