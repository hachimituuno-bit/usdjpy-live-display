name: NEW Blogger Mail2Blogger post (preview only; posting disabled)

# Combined FX/stocks articles are disabled. The dashboard remains updated by
# USDJPY_workflow_fixed.yml and stocks_daily.yml.
# Manual dispatch prints a preview only; it never sends an email.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preview combined market analysis without sending email
        env:
          DRY_RUN: 'true'
        run: python mail_to_blogger.py
