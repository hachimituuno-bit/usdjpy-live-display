name: Recover missing story chapter 13 (guarded)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'false=安全確認のみ / true=暗号化状態を修正'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: new-other-articles-mail-state
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: new_content_requirements.txt
      - run: pip install -r new_content_requirements.txt
      - name: Backup encrypted story state before recovery
        if: inputs.apply == true
        run: |
          set -euo pipefail
          test -f new_daily_content_state.json.enc
          cp new_daily_content_state.json.enc backup_before_chapter13.enc
      - uses: actions/upload-artifact@v4
        if: inputs.apply == true
        with:
          name: encrypted-state-before-chapter13-${{ github.run_id }}
          path: backup_before_chapter13.enc
          retention-days: 7
          if-no-files-found: error
      - name: Validate and optionally fix progress without Gemini or email
        env:
          CONTENT_STATE_KEY: ${{ secrets.CONTENT_STATE_KEY }}
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APPLY" == 'true' ]]; then
            python recover_story_chapter13.py --apply
          else
            python recover_story_chapter13.py
          fi
      - name: Commit repaired encrypted state only
        if: inputs.apply == true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add new_daily_content_state.json.enc
          if git diff --cached --quiet; then
            echo 'No encrypted state changed'
            exit 0
          fi
          git commit -m 'Restore missing novel chapter 13 progression'
          git fetch origin main
          # Fail rather than rebase a repair based on stale state.
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            echo 'Main branch changed: backup saved, but refusing to push stale recovery.'
            exit 1
          fi
          git push origin HEAD:main
