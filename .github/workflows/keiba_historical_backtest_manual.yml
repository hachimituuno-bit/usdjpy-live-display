name: KEIBA JRA historical backtest (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Run 10-race historical backtest (no posting)
        run: python keiba_historical_backtest.py --races-file keiba_races.json

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-historical-backtest-results
          path: keiba_backtest_results/
          retention-days: 7
          if-no-files-found: warn
