name: Advance manually published chapter 13 to 14 (guarded)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'false=確認だけ / true=実際に14話へ進める'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: new-other-articles-mail-state
  cancel-in-progress: false

jobs:
  update-story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: new_content_requirements.txt
      - run: pip install -r new_content_requirements.txt
      - name: Back up encrypted state before changes
        if: inputs.apply == true
        run: cp new_daily_content_state.json.enc backup_before_manual_ch13.enc
      - uses: actions/upload-artifact@v4
        if: inputs.apply == true
        with:
          name: backup-before-manual-ch13-${{ github.run_id }}
          path: backup_before_manual_ch13.enc
          retention-days: 7
          if-no-files-found: error
      - name: Verify published 13 and optionally advance
        shell: bash
        env:
          CONTENT_STATE_KEY: ${{ secrets.CONTENT_STATE_KEY }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [[ "$APPLY" == 'true' ]]; then
            python advance_story_to_14.py --apply
          else
            python advance_story_to_14.py
          fi
      - name: Commit confirmed chapter 13 progress
        if: inputs.apply == true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add new_daily_content_state.json.enc
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'Record manually published novel chapter 13'
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            echo 'Main changed since checkout. Refusing to push stale state.'
            exit 1
          fi
          git push origin HEAD:main
