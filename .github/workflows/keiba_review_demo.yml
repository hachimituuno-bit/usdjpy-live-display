name: KEIBA review demo (offline only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and review synthetic sample
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile keiba_review.py keiba_predict.py
          python keiba_review.py --date 2026-11-07 --predictions examples/predictions_demo.json --results examples/results_demo.csv --demo
      - name: Upload test-only review files
        uses: actions/upload-artifact@v4
        with:
          name: keiba-review-demo-${{ github.run_id }}
          path: keiba_reviews/*
          if-no-files-found: error
          retention-days: 7
