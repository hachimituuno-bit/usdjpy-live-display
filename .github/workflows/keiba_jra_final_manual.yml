name: KEIBA JRA form ranking (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  form-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch 11 horses and rank historical form
        run: |
          python keiba_predict_jra.py --fetch --target-date 2026-11-10
      - name: Save output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-jra-form-ranking
          path: |
            keiba_multi_horse_test.json
            keiba_form_ranking.json
          retention-days: 7
          if-no-files-found: error
