name: Keiba Nakayama 8R V3 Line 116 Inspect (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install parser import dependencies
        run: python -m pip install requests beautifulsoup4 lxml

      - name: Verify required files
        run: |
          test -f keiba_nakayama8r_line116_inspect.py
          test -f keiba_jra_result_fetch.py

      - name: Inspect V3 in-memory parser source without executing parser
        run: |
          python -u keiba_nakayama8r_line116_inspect.py
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('keiba_nakayama8r_line116_inspect.json').read_text(encoding='utf-8'))
          if result.get('status') != 'SOURCE_INSPECTED':
              raise SystemExit('Inspection failed: ' + str(result.get('error')))
          PY

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-nakayama8r-v3-line116-inspection
          path: keiba_nakayama8r_line116_inspect.json
          if-no-files-found: warn
