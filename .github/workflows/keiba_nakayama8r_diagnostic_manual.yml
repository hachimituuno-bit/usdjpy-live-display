name: Keiba Nakayama 8R Diagnostic (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install diagnostic dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Run read-only Nakayama 8R diagnostic
        run: python keiba_nakayama8r_diagnostic.py

      - name: Upload diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-nakayama8r-diagnostic-results
          path: keiba_nakayama8r_diagnostic.json
          if-no-files-found: warn
