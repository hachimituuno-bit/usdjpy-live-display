name: Keiba Step86 Live Scoring Bridge (Manual Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Live entrants to existing metrics (no model prediction)
        run: python keiba_step86_live_scoring_bridge_test.py
      - name: Upload diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-step86-result
          path: keiba_step86_live_scoring_bridge_result.json
          if-no-files-found: warn
