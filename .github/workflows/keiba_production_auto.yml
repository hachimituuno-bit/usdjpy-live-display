name: Yahoo Keiba Auto and Manual
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = all races / manual = one race'
        required: true
        default: auto
        type: choice
        options: [auto, manual]
      date:
        description: 'YYYY-MM-DD (blank = today JST)'
        required: false
        type: string
      venue:
        description: 'For manual: 東京 / 京都 / 福島 etc.'
        required: false
        type: string
      race:
        description: 'For manual: 1..12'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '30 23 * * 5,6'  # Saturday/Sunday 08:30 JST (previous UTC day)
permissions:
  contents: read
concurrency:
  group: yahoo-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Run Yahoo predictions
        env:
          MODE: ${{ inputs.mode }}
          DATE: ${{ inputs.date }}
          VENUE: ${{ inputs.venue }}
          RACE: ${{ inputs.race }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os,subprocess,sys
          from datetime import datetime,date
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo('Asia/Tokyo')).date()
          # Disable only Saturday 2026-11-14 scheduled execution.
          if os.getenv('EVENT_NAME')=='schedule' and today==date(2026,11,14):
              print('Skipping scheduled predictions on 2026-11-14 JST')
              raise SystemExit(0)
          mode=os.getenv('MODE') or 'auto'
          cmd=[sys.executable,'keiba_production_auto.py','--mode',mode]
          for key,flag in [('DATE','--date'),('VENUE','--venue'),('RACE','--race')]:
              if os.getenv(key):cmd.extend([flag,os.environ[key]])
          raise SystemExit(subprocess.call(cmd))
          PY

      - name: Build one readable 36-race Blogger article
        if: success()
        run: python keiba_blog_post.py
      - name: Send article to Blogger by email
        if: success()
        env:
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          set -eu
          if [ -z "$BLOGGER_POST_EMAIL" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo 'ERROR: Blogger SMTP secrets not configured; refusing to report successful send.' >&2
            exit 1
          fi
          python keiba_blog_post.py --send
      - name: Upload predictions and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-production-${{ github.run_id }}
          path: keiba_production_results/
          if-no-files-found: warn
