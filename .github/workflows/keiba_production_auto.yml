name: JRA Production Auto 08-30 JST
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = all races / manual = one race / results = result check (not yet implemented)'
        required: true
        default: auto
        type: choice
        options: [auto, manual, results]
      date:
        description: 'YYYY-MM-DD (blank = today JST)'
        required: false
        type: string
      venue:
        description: 'For manual: 東京 / 京都 / 福島 etc.'
        required: false
        type: string
      race:
        description: 'For manual: 1..12'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '30 23 * * 5,6'  # Saturday/Sunday 08:30 JST
permissions:
  contents: read
concurrency:
  group: jra-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Run JRA predictions
        env:
          MODE: ${{ inputs.mode }}
          DATE: ${{ inputs.date }}
          VENUE: ${{ inputs.venue }}
          RACE: ${{ inputs.race }}
        run: |
          python - <<'PY'
          import os,subprocess,sys
          mode=os.getenv('MODE') or 'auto'
          cmd=[sys.executable,'keiba_production_auto.py','--mode',mode]
          for key,flag in [('DATE','--date'),('VENUE','--venue'),('RACE','--race')]:
              if os.getenv(key): cmd.extend([flag,os.environ[key]])
          raise SystemExit(subprocess.call(cmd))
          PY
      - name: Upload predictions and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-production-${{ github.run_id }}
          path: keiba_production_results/
          if-no-files-found: warn
