name: Keiba Nakayama 8R Safe Parser V4 Test (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Confirm required files exist
        run: |
          test -f keiba_nakayama8r_safe_test_v4.py
          test -f keiba_jra_result_fetch.py
      - name: Run isolated parser test (no posting)
        run: python -u keiba_nakayama8r_safe_test_v4.py
      - name: Verify diagnostic result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('keiba_nakayama8r_safe_test_v4.json').read_text(encoding='utf-8'))
          print('Diagnostic status:', report.get('status'))
          if report.get('status') != 'PASS_PARSER_ONLY':
              raise SystemExit('Parser V4 diagnostic did not pass')
          PY
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-nakayama8r-safe-test-v4-report
          path: keiba_nakayama8r_safe_test_v4.json
          if-no-files-found: warn
