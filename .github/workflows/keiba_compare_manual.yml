
name: Keiba Comparison Test (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Run comparison test (no posting)
        run: |
          python keiba_compare_test.py --races-file keiba_races.json

      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-comparison-results
          path: keiba_comparison_results.json
          if-no-files-found: warn
