name: TEST Blogger plain text mail (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only mail dependency
        run: python -m pip install beautifulsoup4
      - name: Send one plain-text test (does not update story state)
        env:
          DRY_RUN: 'false'
          MAIL_CONTENT_MODE: 'plain'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
        run: |
          python - <<'PY'
          from new_mail_gateway import publish
          publish(
              '【動作確認】GitHubプレーンテキスト投稿テスト',
              '<p>GitHubからのプレーンテキスト方式による送信確認です。</p>',
          )
          PY
