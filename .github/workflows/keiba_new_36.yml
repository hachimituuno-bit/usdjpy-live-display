name: Keiba NEW 36 races (independent)
on:
  schedule:
    # Hourly UTC. The Python gate starts new Sat/Sun races at 01:00 JST,
    # and checks pending publication or retries safe pre-send failures hourly.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (blank = today JST)'
        required: false
        type: string
      publish:
        description: 'true = SMTP send; false = preview only'
        required: true
        default: 'true'
        type: choice
        options: ['false', 'true']
permissions:
  contents: write
concurrency:
  group: keiba-new-all-${{ github.ref }}
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Run scheduled posting and durable hourly retry
        env:
          RACE_DATE: ${{ inputs.date }}
          PUBLISH: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python keiba_new/keiba_post_retry.py
      - name: Commit posting state
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f keiba_new/posting_state.json
          if git diff --cached --quiet; then
            echo 'No state changes.'
            exit 0
          fi
          git commit -m 'Update keiba posting delivery state'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'State conflict; stopping to avoid duplicate sends.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'ERROR: state push failed; check before retrying to avoid duplicates.' >&2
          exit 1
      - name: Upload preview and diagnostic results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: keiba-new-36-${{ github.run_id }}
          path: keiba_new_results/
          if-no-files-found: warn
