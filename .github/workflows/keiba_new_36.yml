name: Keiba NEW 36 races (independent)
on:
  # Saturday and Sunday 08:30 JST (Friday/Saturday 23:30 UTC)
  schedule:
    - cron: '30 23 * * 5,6'
    # One-time extra: 2026-11-15 10:30 JST (01:30 UTC)
    - cron: '30 1 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (blank = today JST)'
        required: false
        type: string
      publish:
        description: 'true = SMTP send; false = preview only'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
permissions:
  contents: read
concurrency:
  group: keiba-new-all-${{ github.ref }}
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Skip extra Sunday schedule except 2026-11-15 JST
        id: one_time
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "30 1 * * 0" ] && [ "$(TZ=Asia/Tokyo date +%F)" != "2026-11-15" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.one_time.outputs.run == 'true' }}
        uses: actions/checkout@v4
      - if: ${{ steps.one_time.outputs.run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        if: ${{ steps.one_time.outputs.run == 'true' }}
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Fetch and score all 36 races (new method 0.5)
        if: ${{ steps.one_time.outputs.run == 'true' }}
        env:
          RACE_DATE: ${{ inputs.date }}
        run: python keiba_new/keiba_new_all_races.py --date "$RACE_DATE"
      - name: Render complete 36-race Blogger article
        if: ${{ steps.one_time.outputs.run == 'true' }}
        run: python keiba_new/keiba_new_blog_post.py
      - name: Send complete new-method article (scheduled or explicit manual true)
        if: ${{ steps.one_time.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.publish == 'true') }}
        env:
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python keiba_new/keiba_new_blog_post.py --send
      - name: Upload preview and diagnostic results
        if: ${{ always() && steps.one_time.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: keiba-new-36-${{ github.run_id }}
          path: keiba_new_results/
          if-no-files-found: warn
