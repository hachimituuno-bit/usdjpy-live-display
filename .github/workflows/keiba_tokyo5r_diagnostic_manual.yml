name: Keiba Tokyo 5R Diagnostic (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4
      - name: Run Tokyo 5R diagnostic (no posting)
        run: python keiba_tokyo5r_diagnostic.py
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-tokyo5r-diagnostic-results
          path: keiba_tokyo5r_diagnostic.json
          if-no-files-found: warn
