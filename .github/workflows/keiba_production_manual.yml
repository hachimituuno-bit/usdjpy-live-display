name: JRA Production Prediction (Manual Only)

on:
  workflow_dispatch:
    inputs:
      entries_json:
        description: 'Confirmed official JRA entries JSON (all runners, horse URLs); do not use result pages'
        required: true
        type: string

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Write entries safely
        env:
          ENTRIES_JSON: ${{ inputs.entries_json }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(os.environ['ENTRIES_JSON'])
          Path('keiba_production_entries.json').write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
          PY
      - name: Predict (read only)
        run: python keiba_production_predict.py --entries keiba_production_entries.json
      - name: Upload prediction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-production-prediction
          path: keiba_production_results/
          if-no-files-found: warn
