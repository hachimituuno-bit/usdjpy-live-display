name: Keiba Step82 Offline Contract (Manual Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Offline contract test only
        run: python keiba_step82_contract_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keiba-step82-contract-result
          path: keiba_step82_contract_result.json
          if-no-files-found: warn
