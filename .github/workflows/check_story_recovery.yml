name: Check story state (read-only, no email)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: new_content_requirements.txt
      - run: pip install -r new_content_requirements.txt
      - name: Inspect encrypted progress and Blogger feed without posting
        env:
          CONTENT_STATE_KEY: ${{ secrets.CONTENT_STATE_KEY }}
        run: python check_story_recovery.py
