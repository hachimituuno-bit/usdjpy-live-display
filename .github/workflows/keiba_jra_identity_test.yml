
name: KEIBA JRA identity TEST (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4

      - name: Verify JRA horse identity candidates
        run: |
          python keiba_jra_identity_test.py \
            --output keiba_identity_test.json

      - name: Upload test results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-jra-identity-test
          path: keiba_identity_test.json
          retention-days: 1
          if-no-files-found: error
