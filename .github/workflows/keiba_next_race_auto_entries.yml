name: KEIBA JRA next race - fetch entries and rank (manual only)

on:
  workflow_dispatch:
    inputs:
      race_card_url:
        description: "Official JRA race card URL (not results URL)"
        required: true
        type: string
      race_date:
        description: "Race date YYYY-MM-DD"
        required: true
        type: string
      venue:
        description: "Venue, e.g. 東京"
        required: true
        type: string
      race_number:
        description: "Race number 1-12"
        required: true
        type: string
      race_name:
        description: "Official race name"
        required: true
        type: string
      expected_horses:
        description: "Official declared number of horses"
        required: true
        type: string

permissions:
  contents: read

jobs:
  race-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch entries from official race card
        env:
          RACE_CARD_URL: ${{ inputs.race_card_url }}
          RACE_DATE: ${{ inputs.race_date }}
          VENUE: ${{ inputs.venue }}
          RACE_NUMBER: ${{ inputs.race_number }}
          RACE_NAME: ${{ inputs.race_name }}
          EXPECTED_HORSES: ${{ inputs.expected_horses }}
        run: |
          python keiba_next_entries_fetch.py --url "$RACE_CARD_URL" --date "$RACE_DATE" --venue "$VENUE" --race-number "$RACE_NUMBER" --race-name "$RACE_NAME" --expected-horses "$EXPECTED_HORSES" --output keiba_next_entries.json
      - name: Fetch historical runs
        run: python keiba_next_collect.py --entries keiba_next_entries.json --output keiba_next_history.json
      - name: Rank
        run: python keiba_next_race.py --entries keiba_next_entries.json --history keiba_next_history.json --output keiba_next_race_ranking.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-next-race-results
          path: |
            keiba_next_entries.json
            keiba_next_history.json
            keiba_next_race_ranking.json
          if-no-files-found: warn
          retention-days: 7
