name: KEIBA JRA Friday prediction and Blogger post

on:
  schedule:
    - cron: '15 9 * * 5' # Friday 18:15 JST
  workflow_dispatch:

permissions:
  contents: write # Only to persist keiba_published_races.json

concurrency:
  group: keiba-friday-blogger
  cancel-in-progress: false

jobs:
  rolling-races:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Friday live or manual historical fallback
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python keiba_friday_or_manual.py --mode manual
          else
            python keiba_friday_or_manual.py --mode scheduled
          fi
      - name: Blogger posting (scheduled Fridays only)
        if: github.event_name == 'schedule'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
        run: python keiba_blogger_publish.py --mode scheduled
      - name: Persist sent-race ledger
        if: github.event_name == 'schedule'
        run: |
          if git status --porcelain -- keiba_published_races.json | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add keiba_published_races.json
            git commit -m 'Record JRA Blogger email submissions'
            git push
          fi
      - name: Upload rankings and backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-ranking-and-backtest
          path: |
            keiba_rolling_results/
            keiba_backtest_results/
          if-no-files-found: ignore
          retention-days: 14
