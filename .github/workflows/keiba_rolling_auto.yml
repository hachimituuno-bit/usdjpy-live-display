name: KEIBA JRA rolling race discovery (no posting)

on:
  schedule:
    # Every Friday 18:15 JST = Friday 09:15 UTC
    - cron: '15 9 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keiba-rolling-races
  cancel-in-progress: false

jobs:
  rolling-races:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Friday live or manual historical fallback
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python keiba_friday_or_manual.py --mode manual
          else
            python keiba_friday_or_manual.py --mode scheduled
          fi
      - name: Upload rankings and backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-ranking-and-backtest
          path: |
            keiba_rolling_results/
            keiba_backtest_results/
          if-no-files-found: ignore
          retention-days: 14
