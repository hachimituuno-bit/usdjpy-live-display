name: Keiba Nakayama 8R Safe Parser V2 Diagnostic (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Confirm required files exist
        run: |
          test -f keiba_nakayama8r_safe_test_v2.py
          test -f keiba_jra_result_fetch.py
      - name: Run isolated diagnostic (no posting)
        run: python -u keiba_nakayama8r_safe_test_v2.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-nakayama8r-safe-test-v2-report
          path: keiba_nakayama8r_safe_test.json
          if-no-files-found: warn
