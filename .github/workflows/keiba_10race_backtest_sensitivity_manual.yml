name: Keiba 10 Races Backtest and Surface Sensitivity (Manual Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest-and-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Check race count and Python syntax
        run: |
          python -c "import json; r=json.load(open('keiba_races.json', encoding='utf-8')); assert len(r)==10, f'Expected 10 races, got {len(r)}'; print('RACES:', len(r))"
          python -m py_compile keiba_historical_backtest.py keiba_surface_sensitivity.py
      - name: Run 10-race historical backtest (no publishing)
        id: historical
        continue-on-error: true
        run: python keiba_historical_backtest.py --races-file keiba_races.json
      - name: Run five surface-penalty comparisons (no publishing)
        id: sensitivity
        continue-on-error: true
        run: python keiba_surface_sensitivity.py --races-file keiba_races.json --output keiba_surface_sensitivity_results.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-10race-backtest-and-sensitivity
          path: |
            keiba_backtest_results/
            keiba_surface_sensitivity_results.json
          if-no-files-found: warn
      - name: Fail job if either run failed
        if: always()
        env:
          HISTORICAL: ${{ steps.historical.outcome }}
          SENSITIVITY: ${{ steps.sensitivity.outcome }}
        run: |
          echo "Historical: $HISTORICAL"
          echo "Sensitivity: $SENSITIVITY"
          test "$HISTORICAL" = success && test "$SENSITIVITY" = success
