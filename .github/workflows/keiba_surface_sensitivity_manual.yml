name: Keiba Surface Sensitivity (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Run surface sensitivity test (no posting)
        run: |
          python keiba_surface_sensitivity.py --races-file keiba_races.json

      - name: Upload sensitivity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-surface-sensitivity-results
          path: keiba_surface_sensitivity_results.json
          if-no-files-found: warn
