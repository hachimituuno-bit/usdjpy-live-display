name: NEW USDJPY live display (No Google Cloud)
on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'
      timezone: 'Asia/Tokyo'
permissions:
  contents: write
concurrency:
  group: usdjpy-live-data
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate fresh USDJPY data
        run: python fx_generate.py
      - name: Commit updated data when changed
        run: |
          if git diff --quiet -- docs/latest.json; then
            echo 'No content changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/latest.json
          git commit -m 'Update USDJPY market data'
          git push
