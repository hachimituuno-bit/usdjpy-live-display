name: KEIBA Gemini historical URL extraction (review only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract historical Kyoto 12R JSON with Gemini (no mail)
        env:
          KEIBA_GEMINI_API_KEY: ${{ secrets.KEIBA_GEMINI_API_KEY }}
        run: python keiba_gemini_extract.py
      - name: Upload manual-review JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-gemini-kyoto12-review
          path: keiba_gemini_review/*.json
          retention-days: 7
          if-no-files-found: error
