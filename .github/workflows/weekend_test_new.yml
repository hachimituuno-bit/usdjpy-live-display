name: NEW weekend analysis TEST (temporary)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Choose fx, stocks, both, or a one-off email test'
        type: choice
        options:
          - both
          - fx
          - stocks
          - mail
        default: both
        required: true
      dry_run:
        description: 'Mail test only: true=preview, false=send ONE email'
        type: boolean
        default: true
        required: true
  schedule:
    # GitHub cron is UTC, +9 hours = Japan time.
    # Sat/Sun 07:02-08:57 JST: check every 5 minutes; generate only after 15 minutes.
    - cron: '2-59/5 22-23 * * 5,6'
    # Sat/Sun 09:02-23:57 JST: check every 5 minutes.
    - cron: '2-59/5 0-14 * * 6,0'
    # Sun/Mon 00:07-06:07 JST, hourly.
    - cron: '7 15-21 * * 6,0'
    # One stock-data refresh on Sat and Sun, 16:30 JST (07:30 UTC).
    - cron: '30 7 * * 6,0'

permissions:
  contents: write

jobs:
  fx-weekend:
    if: >-
      ${{
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'fx' || inputs.target == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule != '30 7 * * 6,0')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: usdjpy-live-data
      cancel-in-progress: false
    env:
      WEEKEND_TEST_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check weekend window and last FX generation time
        id: gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('Asia/Tokyo'))
          w, h = now.weekday(), now.hour
          weekend_window = (w == 5 and h >= 7) or w == 6 or (w == 0 and h < 7)
          manual = os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          allowed = manual or weekend_window
          reason = 'manual test' if manual else 'outside weekend test window'

          if allowed and not manual:
              path = Path('docs/latest.json')
              if not path.exists():
                  reason = 'no previous FX JSON'
              else:
                  try:
                      data = json.loads(path.read_text(encoding='utf-8'))
                      raw = data.get('generated_at_jst')
                      if not raw:
                          raise ValueError('generated_at_jst missing')
                      previous = datetime.fromisoformat(raw.replace('Z', '+00:00'))
                      if previous.tzinfo is None:
                          raise ValueError('timestamp lacks timezone')
                      age_seconds = (now - previous).total_seconds()
                      allowed = age_seconds >= 15 * 60
                      reason = f'last FX generation {age_seconds / 60:.1f} minutes ago'
                  except (ValueError, TypeError, json.JSONDecodeError) as exc:
                      # Generate again rather than keeping an invalid timestamp indefinitely.
                      reason = f'missing/invalid previous FX timestamp: {type(exc).__name__}'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"allowed={str(allowed).lower()}\n")
          print(f'JST: {now.isoformat(timespec="seconds")}')
          print(f'FX: {"RUN" if allowed else "SKIP"} ({reason})')
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.allowed == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.allowed == 'true'
      - name: Generate FX data (weekend test)
        if: steps.gate.outputs.allowed == 'true'
        run: python fx_generate.py
      - name: Commit fresh FX JSON
        if: steps.gate.outputs.allowed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/latest.json
          if git diff --cached --quiet; then
            echo 'FX JSON unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m 'Test weekend USDJPY data update'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "JSON saved to GitHub (attempt ${attempt})."
              exit 0
            fi
            echo "Concurrent update detected; retry ${attempt}/5..."
            sleep 3
          done
          echo 'ERROR: JSON push failed after five attempts.' >&2
          exit 1

  stocks-weekend:
    if: >-
      ${{
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'stocks' || inputs.target == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule == '30 7 * * 6,0')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: usdjpy-stocks-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify JST weekend window for scheduled run
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo('Asia/Tokyo'))
          in_test = now.weekday() in (5, 6)
          enabled = os.environ.get('GITHUB_EVENT_NAME') != 'schedule' or in_test
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"allowed={str(enabled).lower()}\n")
          print('JST', now.isoformat(timespec='seconds'), 'stocks allowed:', enabled)
          PY
      - name: Generate stock data (latest available trading day)
        if: steps.gate.outputs.allowed == 'true'
        run: python stocks_generate.py
      - name: Commit fresh stocks JSON
        if: steps.gate.outputs.allowed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/stocks_latest.json
          if git diff --cached --quiet; then
            echo 'Stock JSON unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m 'Test weekend Japan stocks data update'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "JSON saved to GitHub (attempt ${attempt})."
              exit 0
            fi
            echo "Concurrent update detected; retry ${attempt}/5..."
            sleep 3
          done
          echo 'ERROR: JSON push failed after five attempts.' >&2
          exit 1

  mail-test:
    if: >-
      ${{github.event_name == 'workflow_dispatch' && inputs.target == 'mail'}}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preview or send ONE test mail (never scheduled)
        env:
          DRY_RUN: ${{inputs.dry_run && 'true' || 'false'}}
          SMTP_HOST: ${{secrets.SMTP_HOST}}
          SMTP_PORT: ${{secrets.SMTP_PORT}}
          SMTP_USERNAME: ${{secrets.SMTP_USERNAME}}
          SMTP_PASSWORD: ${{secrets.SMTP_PASSWORD}}
          BLOGGER_POST_EMAIL: ${{secrets.BLOGGER_POST_EMAIL}}
        run: python mail_to_blogger.py
