name: KEIBA Gemini historical odds-only review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and independently check historical odds (never post)
        env:
          KEIBA_GEMINI_API_KEY: ${{ secrets.KEIBA_GEMINI_API_KEY }}
        run: python keiba_gemini_odds_only.py
      - name: Upload verified historical JSON only
        uses: actions/upload-artifact@v4
        with:
          name: keiba-gemini-odds-only-review
          path: keiba_gemini_review/2026-11-08_kyoto12_odds_only.json
          if-no-files-found: error
          retention-days: 7
