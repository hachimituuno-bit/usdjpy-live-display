name: KEIBA adapter test (offline draft only)
on:
  workflow_dispatch:
    inputs:
      race_date:
        description: '対象日 YYYY-MM-DD（土曜か日曜）'
        required: true
        default: '2026-11-07'
        type: string
      demo:
        description: 'true=架空データのみ（ブログ公開禁止）'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline validation and draft generation
        shell: bash
        env:
          DAY: ${{ inputs.race_date }}
          DEMO: ${{ inputs.demo }}
        run: |
          set -euo pipefail
          if [[ "$DEMO" == 'true' ]]; then
            python keiba_convert.py --input examples/raw_synthetic_for_adapter.json --date "$DAY" --demo
          else
            SOURCE="keiba_source/${DAY}.json"
            if [[ ! -f "$SOURCE" ]]; then
              echo 'SKIP: 許可を得た入力がありません。記事・メールを生成しません。'
              exit 0
            fi
            python keiba_convert.py --input "$SOURCE" --date "$DAY"
          fi
      - name: Upload draft HTML (never email)
        uses: actions/upload-artifact@v4
        with:
          name: keiba-adapter-draft-${{ github.run_id }}
          path: keiba_drafts/*_ADAPTER_*.html
          if-no-files-found: ignore
          retention-days: 7
