
name: KEIBA Gemini URL reading test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Test URL Context
        env:
          API_KEY: ${{ secrets.KEIBA_GEMINI_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.environ.get("API_KEY", "")
          if not key:
              raise SystemExit("ERROR: API key missing")

          model = "gemini-3.5-flash-lite"
          target = "https://www.iana.org/domains/reserved"

          payload = {
              "contents": [{
                  "parts": [{
                      "text": (
                          "次のURLのページをURL Contextで読み取って、"
                          "何についてのページか日本語で一文で説明してください。"
                          "読み取れなければ推測しないでください。\n"
                          + target
                      )
                  }]
              }],
              "tools": [{"urlContext": {}}]
          }

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/" + model + ":generateContent"
          )

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=60
              ) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"ERROR: Gemini HTTP {exc.code}")
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: {type(exc).__name__}"
              )

          candidates = result.get("candidates", [])
          if not candidates:
              raise SystemExit("ERROR: No Gemini response")

          candidate = candidates[0]
          metadata = candidate.get("urlContextMetadata", {})
          entries = metadata.get("urlMetadata", [])

          print("URL_CONTEXT_METADATA:")
          for entry in entries:
              print(
                  entry.get("retrievedUrl", ""),
                  entry.get("urlRetrievalStatus", "UNKNOWN")
              )

          successful = any(
              "SUCCESS" in e.get("urlRetrievalStatus", "")
              for e in entries
          )
          if not successful:
              raise SystemExit(
                  "ERROR: URL retrieval not confirmed"
              )

          parts = candidate.get("content", {}).get("parts", [])
          response_text = " ".join(
              p.get("text", "")
              for p in parts if isinstance(p, dict)
          )

          print("GEMINI_URL_READ_OK")
          print("SUMMARY:", response_text[:400])
          PY
