
name: KEIBA JRA batch fetch TEST (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-fetch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4

      - name: Fetch multiple JRA historical races
        run: |
          python keiba_jra_batch_fetch.py \
            --output-dir keiba_jra_results

      - name: Upload batch test results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-jra-batch-test
          path: keiba_jra_results/
          retention-days: 1
          if-no-files-found: error
