name: NEW Japan stocks top 3 (No Google Cloud)

on:
  workflow_dispatch:
  schedule:
    # JST Mon-Fri 16:30 = UTC Mon-Fri 07:30
    # Exchange holidays may run; uses latest available daily candle.
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: usdjpy-stocks-daily
  cancel-in-progress: false

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Generate Japan stocks top 3
        run: python stocks_generate.py
      - name: Commit stock data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/stocks_latest.json
          if git diff --cached --quiet; then
            echo 'No content changes.'
            exit 0
          fi
          git commit -m 'Update Japan stocks top 3'
          git push
