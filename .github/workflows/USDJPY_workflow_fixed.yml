name: NEW USDJPY live display (No Google Cloud)

# Production USD/JPY analysis. Special weekend operation is allowed ONLY
# 2026-10-31 07:00 to 2026-11-02 07:00 Japan time.
# From 2026-11-07 onward, every Sat 07:00 -> Mon 07:00 JST is paused.
on:
  workflow_dispatch:
  schedule:
    # Normal weeks: Monday-Friday JST 07:02-23:57, try every 5 minutes.
    # UTC Sun-Thu 22:02-23:57 -> JST Mon-Fri 07:02-08:57.
    - cron: '2-59/5 22-23 * * 0-4'
    # UTC Mon-Fri 00:02-14:57 -> JST Mon-Fri 09:02-23:57.
    - cron: '2-59/5 0-14 * * 1-5'
    # Normal nights: JST Tue-Sat 00:07-06:07, hourly.
    # UTC Mon-Fri 15:07-21:07.
    - cron: '7 15-21 * * 1-5'

    # ONE-TIME WEEKEND EXCEPTION: 2026-10-31 (Sat) -> 2026-11-02 (Mon) 07:00 JST.
    # GitHub cron has no year field. The Python gate below prevents
    # these same calendar-date patterns from running in later years.
    # UTC Oct 30 and Oct 31 22:02-23:57 -> JST Oct 31 / Nov 01 07:02-08:57.
    - cron: '2-59/5 22-23 30,31 10 *'
    # UTC Oct 31 00:02-14:57 -> JST Oct 31 09:02-23:57.
    - cron: '2-59/5 0-14 31 10 *'
    # UTC Nov 01 00:02-14:57 -> JST Nov 01 09:02-23:57.
    - cron: '2-59/5 0-14 1 11 *'
    # UTC Oct 31 15:07-21:07 -> JST Nov 01 00:07-06:07.
    - cron: '7 15-21 31 10 *'
    # UTC Nov 01 15:07-21:07 -> JST Nov 02 00:07-06:07.
    - cron: '7 15-21 1 11 *'

permissions:
  contents: write

# Shares the same lock as the previous weekend tester during migration.
concurrency:
  group: usdjpy-live-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check JST operating window and 15-minute update interval
        id: gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo('Asia/Tokyo')
          now = datetime.now(tz)
          start = datetime(2026, 10, 31, 7, 0, tzinfo=tz)
          end = datetime(2026, 11, 2, 7, 0, tzinfo=tz)
          special_weekend = start <= now < end
          w, hour = now.weekday(), now.hour
          paused_weekend = ((w == 5 and hour >= 7) or w == 6 or
                            (w == 0 and hour < 7))
          allowed = special_weekend or not paused_weekend
          reason = ('2026 one-time weekend exception' if special_weekend else
                    'normal weekday window' if allowed else
                    'scheduled weekend pause')

          # Do not recalculate more often than approximately every 15 min.
          # If Actions is delayed, the next execution can catch up.
          if allowed:
              path = Path('docs/latest.json')
              if path.exists():
                  try:
                      data = json.loads(path.read_text(encoding='utf-8'))
                      timestamp = data['generated_at_jst']
                      previous = datetime.fromisoformat(timestamp.replace('Z', '+00:00'))
                      if previous.tzinfo is None:
                          raise ValueError('timestamp lacks timezone')
                      age = (now - previous).total_seconds()
                      allowed = age >= 15 * 60
                      reason += f'; last update {age / 60:.1f} minutes ago'
                  except (KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
                      reason += f'; timestamp unavailable ({type(exc).__name__})'
              else:
                  reason += '; no previous JSON'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run={str(allowed).lower()}\n')
              output.write(f'weekend_override={str(special_weekend).lower()}\n')
          print('JST:', now.isoformat(timespec='seconds'))
          print('FX:', 'RUN' if allowed else 'SKIP', f'({reason})')
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Generate fresh USDJPY data
        if: steps.gate.outputs.run == 'true'
        env:
          # The current fx_generate.py recognizes this existing override.
          # TRUE only in the one-time 2026 weekend; FALSE during normal operation.
          WEEKEND_TEST_MODE: ${{ steps.gate.outputs.weekend_override }}
        run: python fx_generate.py

      - name: Commit updated data when changed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/latest.json
          if git diff --cached --quiet; then
            echo 'FX JSON unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m 'Update USDJPY market data'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "FX JSON published to main (attempt ${attempt})."
              exit 0
            fi
            echo "Concurrent push detected; retry ${attempt}/5."
            sleep 3
          done
          echo 'ERROR: FX JSON push failed after five attempts.' >&2
          exit 1
