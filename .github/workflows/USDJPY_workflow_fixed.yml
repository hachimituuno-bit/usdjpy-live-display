
name: NEW USDJPY live display (No Google Cloud)

on:
  workflow_dispatch:
  
  schedule:
    - cron: '7,22,37,52 * * * 1-5'
      timezone: 'Asia/Tokyo'
    - cron: '7,22,37,52 0-6 * * 6'
      timezone: 'Asia/Tokyo'
    - cron: '7,22,37,52 7-23 * * 0'
      timezone: 'Asia/Tokyo'

permissions:
  contents: write

concurrency:
  group: usdjpy-live-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate fresh USDJPY data
        run: python fx_generate.py

      - name: Commit updated data when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/latest.json
          if git diff --cached --quiet; then
            echo 'No content changes.'
            exit 0
          fi
          git commit -m 'Update USDJPY market data'
          git push
